<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>個案分析演練</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F4F1EA;
    --ink: #262420;
    --muted: #8A8577;
    --label: #6B6558;
    --card-border: #E3DFD3;
    --card-bg: #FFFFFF;
    --field-bg: #FBFAF7;
    --field-border: #DCD7C9;
    --accent: #2F6F68;
    --accent-dark: #234F4A;
    --gold-bg: #FBF8F0;
    --gold-border: #E9E1C9;
    --gold-text: #8A6D1F;
    --tag-bg: #E4E9DA;
    --tag-text: #3E5C3A;
    --good: #3E5C3A;
    --warn: #9C5A3C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  a { color: var(--accent); }
  ::placeholder { color: #9C968A; }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .eyebrow {
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
    font-size: 28px;
    line-height: 1.35;
    color: var(--ink);
  }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--tag-bg);
    color: var(--tag-text);
    font-weight: 500;
  }

  .tabbar {
    display: flex;
    gap: 8px;
    padding: 6px;
    background: #EFEBE0;
    border-radius: 14px;
    width: fit-content;
  }
  .tab-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid transparent;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
  }
  .tab-btn.active {
    border-color: var(--accent);
    background: #FFFFFF;
    color: var(--accent);
  }
  .tab-btn svg { flex-shrink: 0; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card.gold { background: var(--gold-bg); border-color: var(--gold-border); }
  .card-heading { display: flex; align-items: center; gap: 8px; }
  .bar { width: 4px; height: 18px; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
  .bar.gold { background: #B8912F; }
  .card-heading h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--ink); }
  .card p { margin: 0; font-size: 15px; line-height: 2.1; letter-spacing: 0.02em; color: #4A463D; font-family: "Noto Serif TC", serif; max-width: 560px; }
  .card p + p { margin-top: 22px; }
  .fb-row p { max-width: none; font-family: "Noto Sans TC", system-ui, sans-serif; line-height: 1.8; letter-spacing: normal; margin: 0; text-align: justify; }
  .bg-heading {
    font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 16px; color: var(--accent);
    margin: 28px 0 4px; padding-top: 20px; border-top: 1px solid var(--card-border);
  }
  .bg-heading:first-child { margin-top: 0; padding-top: 0; border-top: none; }

  .quote-block {
    background: var(--field-bg); border: 1px solid var(--card-border); border-radius: 10px;
    padding: 18px 20px; margin-top: 20px; display: flex; flex-direction: column; gap: 10px;
  }
  .quote-head { display: flex; align-items: center; gap: 8px; }
  .quote-avatar {
    width: 24px; height: 24px; border-radius: 999px; background: var(--accent); color: #fff;
    font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .quote-speaker { font-size: 12px; font-weight: 700; color: var(--accent); }
  .quote-text { margin: 0 0 0 32px; font-size: 15px; line-height: 1.9; letter-spacing: 0.02em; color: #4A463D; font-family: "Noto Serif TC", serif; font-style: italic; max-width: 520px; }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }
  @media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--label); }
  .field input, .field textarea {
    font-family: inherit;
    border: 1px solid var(--field-border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--ink);
    background: var(--field-bg);
  }
  .field textarea { resize: vertical; line-height: 1.7; }

  .q-card { gap: 14px; }
  .q-head { display: flex; align-items: flex-start; gap: 12px; }
  .q-no {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .q-text { font-size: 15px; font-weight: 600; line-height: 1.6; }
  .q-hint { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 4px; }

  .btn {
    font-family: inherit;
    padding: 13px 32px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { background: #B7C4C1; cursor: not-allowed; }
  .btn-row { display: flex; justify-content: flex-end; }
  .btn-secondary {
    font-family: inherit;
    background: none;
    border: none;
    color: var(--label);
    font-size: 14px;
    cursor: pointer;
    padding: 8px 0;
  }

  .status-msg { font-size: 14px; color: var(--muted); padding: 40px 0; text-align: center; }
  .error-msg { font-size: 14px; color: var(--warn); padding: 20px 24px; background: var(--gold-bg); border: 1px solid var(--gold-border); border-radius: 12px; }

  .recap-row { display: flex; flex-direction: column; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid #EFEBE0; }
  .recap-row:last-child { border-bottom: none; padding-bottom: 0; }
  .recap-q { font-size: 13px; font-weight: 600; color: #4A463D; }
  .recap-a { font-size: 13px; line-height: 1.7; color: var(--label); }

  .type-badge {
    font-size: 15px; font-weight: 700; padding: 5px 16px; border-radius: 999px;
    background: var(--accent); color: #fff; display: inline-block;
  }
  .fb-row { display: flex; flex-direction: column; gap: 4px; }
  .fb-label { font-size: 12px; font-weight: 600; color: var(--label); }
  .fb-two-col { display: flex; flex-direction: column; gap: 18px; }
  .fb-strength .fb-label { color: var(--good); }
  .fb-blindspot .fb-label { color: var(--warn); }
  .fb-divider { padding-top: 6px; border-top: 1px solid var(--gold-border); }

  .bottom-row { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; }

  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    .tabbar, .btn-row, .bottom-row { display: none !important; }
    body { background: #fff; }
    .page { max-width: 100%; padding: 0; }
    .quote-block, .recap-row, .fb-row, .fb-two-col { break-inside: avoid; }
    /* Chrome 列印時沒辦法把 flex 容器攔腰分頁，會整塊被推到下一頁、留下大片空白。
       這裡把卡片改回一般區塊排版，讓內容可以在合適的地方自然斷頁。 */
    .card { display: block !important; }
    .card > * + * { margin-top: 14px; }
    .card-heading { display: flex !important; } /* 這個很小，維持flex沒差 */
  }
</style>
</head>
<body>

<div class="page" id="app">
  <div class="status-msg" id="initial-loading">載入個案內容中…</div>
</div>

<script>
// ===== 設定：換成你自己的 Apps Script Web App 網址 =====
const API_URL = 'https://script.google.com/macros/s/AKfycbxRq7kWdmULRrUq-U22-Fe72ZknmeAERmtVzinVzFATJztBwSn6DaKs0qt5aQIMeoGaNw/exec';

const app = document.getElementById('app');

let caseData = null;
let activeTab = 'case'; // 'case' | 'answer'
let view = 'form'; // 'form' | 'result'
let submitting = false;
let resultData = null;

// 多個案依序完成：網址帶 ?cases=CASE001,CASE002 時才會用到，沒有帶就是空陣列、維持原本單一啟用個案的行為
const caseQueue = (new URLSearchParams(window.location.search).get('cases') || '')
  .split(',').map(s => s.trim()).filter(Boolean);
let caseQueueIndex = 0;

// 作答內容的暫存（工號/姓名/單位 + 每題的回答），切分頁重新渲染畫面時要用這個把值補回去，不然畫面重畫時輸入框會變空白
let draftState = { empId: '', empName: '', empUnit: '', answers: {} };

const ICON_CASE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="16" y2="17"></line></svg>';
const ICON_ANSWER = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"></path></svg>';

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// 個案背景現在是結構化的 block 陣列（小標題／段落／引言），這裡依 type 渲染成不同樣式
function renderBackgroundBlocks(blocks) {
  if (!Array.isArray(blocks) || blocks.length === 0) return '';
  return blocks.map(b => {
    if (b.type === 'heading') {
      return `<h3 class="bg-heading">${escapeHtml(b.text)}</h3>`;
    }
    if (b.type === 'quote') {
      const initial = (b.speaker || '?').charAt(0);
      return `
        <div class="quote-block">
          <div class="quote-head">
            <div class="quote-avatar">${escapeHtml(initial)}</div>
            <span class="quote-speaker">${escapeHtml(b.speaker || '')}${b.role ? `（${escapeHtml(b.role)}）` : ''}</span>
          </div>
          <p class="quote-text">「${escapeHtml(b.text)}」</p>
        </div>
      `;
    }
    return `<p>${escapeHtml(b.text)}</p>`;
  }).join('');
}

// 遇到暫時性的網路狀況（例如 Apps Script 偶發的瞬間不穩）自動重試，不用讓學員自己手動重試
async function fetchWithRetry(url, options, retries = 4, delayMs = 1500) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      return await fetch(url, options);
    } catch (err) {
      if (attempt === retries) throw err;
      await new Promise(resolve => setTimeout(resolve, delayMs * (attempt + 1)));
    }
  }
}

// ===== 載入個案內容 =====
async function loadCase() {
  app.innerHTML = `<div class="status-msg">載入個案內容中…</div>`;
  const specificCaseId = caseQueue.length ? caseQueue[caseQueueIndex] : null;
  const cacheBust = `&_t=${Date.now()}`; // 避免瀏覽器快取住舊的回應，每次都當成新請求
  const url = specificCaseId
    ? `${API_URL}?action=getCase&caseId=${encodeURIComponent(specificCaseId)}${cacheBust}`
    : `${API_URL}?action=getCase${cacheBust}`;
  try {
    const res = await fetchWithRetry(url, { cache: 'no-store' });
    const data = await res.json();
    if (!data.found) {
      app.innerHTML = `<div class="error-msg">${escapeHtml(data.message || '目前沒有啟用中的個案，請聯繫訓練承辦人。')}</div>`;
      return;
    }
    caseData = data;
    activeTab = 'case';
    view = 'form';
    submitting = false;
    draftState = { empId: '', empName: '', empUnit: '', answers: {} };
    renderForm();
  } catch (err) {
    app.innerHTML = `<div class="error-msg">個案內容載入失敗，請重新整理頁面再試一次。（${escapeHtml(err.message)}）</div>`;
  }
}

// ===== 畫面：作答表單（個案內容 / 作答區域 分頁）=====
function renderForm() {
  const tagsHtml = caseData.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');

  const questionsHtml = caseData.questions.map(q => `
    <div class="card q-card">
      <div class="q-head">
        <div class="q-no">${q.no}</div>
        <div>
          <div class="q-text">${escapeHtml(q.text)}</div>
          <div class="q-hint">提示：${escapeHtml(q.hint)}</div>
        </div>
      </div>
      <div class="field">
        <label for="ans-${q.no}">你的回答</label>
        <textarea id="ans-${q.no}" rows="4" placeholder="請描述你的處理方式與想法……"></textarea>
      </div>
    </div>
  `).join('');

  app.innerHTML = `
    <div class="eyebrow">個案分析演練</div>
    <h1>${escapeHtml(caseData.title)}</h1>
    <div class="tags">${tagsHtml}</div>

    <div class="tabbar">
      <button type="button" class="tab-btn ${activeTab === 'case' ? 'active' : ''}" id="tab-case">${ICON_CASE} 個案內容</button>
      <button type="button" class="tab-btn ${activeTab === 'answer' ? 'active' : ''}" id="tab-answer">${ICON_ANSWER} 作答區域</button>
    </div>

    <div id="case-panel" style="display: ${activeTab === 'case' ? 'block' : 'none'};">
      <div class="card" style="margin-bottom: 24px;">
        <div class="card-heading"><div class="bar"></div><h2>個案背景</h2></div>
        ${renderBackgroundBlocks(caseData.background)}
      </div>
      <div class="card gold" style="margin-bottom: 24px;">
        <div class="card-heading"><div class="bar gold"></div><h2>重點摘要</h2></div>
        <p>${escapeHtml(caseData.keypoint)}</p>
      </div>
      <div class="btn-row">
        <button type="button" class="btn" id="go-answer">閱讀完畢，前往作答 →</button>
      </div>
    </div>

    <div id="answer-panel" style="display: ${activeTab === 'answer' ? 'flex' : 'none'}; flex-direction: column; gap: 24px;">
      <div class="card field-grid" style="padding: 20px 24px;">
        <div class="field"><label for="empId">工號</label><input id="empId" type="text" placeholder="請輸入工號"></div>
        <div class="field"><label for="empName">姓名</label><input id="empName" type="text" placeholder="請輸入姓名"></div>
        <div class="field"><label for="empUnit">所屬單位</label><input id="empUnit" type="text" placeholder="請輸入所屬單位"></div>
      </div>
      ${questionsHtml}
      <div class="btn-row">
        <button type="button" class="btn" id="submit-btn">送出回答，查看 AI 回饋</button>
      </div>
      <div id="submit-error"></div>
    </div>
  `;

  document.getElementById('tab-case').onclick = () => { activeTab = 'case'; renderForm(); };
  document.getElementById('tab-answer').onclick = () => { activeTab = 'answer'; renderForm(); };
  document.getElementById('go-answer').onclick = () => { activeTab = 'answer'; renderForm(); };
  document.getElementById('submit-btn').onclick = handleSubmit;

  // 把暫存的作答內容補回畫面（每次renderForm都會重畫整個畫面，不補回去的話切分頁會把已經打的字清空）
  const empIdEl = document.getElementById('empId');
  const empNameEl = document.getElementById('empName');
  const empUnitEl = document.getElementById('empUnit');
  empIdEl.value = draftState.empId;
  empNameEl.value = draftState.empName;
  empUnitEl.value = draftState.empUnit;
  empIdEl.oninput = e => { draftState.empId = e.target.value; };
  empNameEl.oninput = e => { draftState.empName = e.target.value; };
  empUnitEl.oninput = e => { draftState.empUnit = e.target.value; };

  caseData.questions.forEach(q => {
    const el = document.getElementById(`ans-${q.no}`);
    el.value = draftState.answers[q.no] || '';
    el.oninput = e => { draftState.answers[q.no] = e.target.value; };
  });
}

// ===== 送出答案 =====
async function handleSubmit() {
  const empId = document.getElementById('empId').value.trim();
  const empName = document.getElementById('empName').value.trim();
  const empUnit = document.getElementById('empUnit').value.trim();

  if (!empId || !empName || !empUnit) {
    document.getElementById('submit-error').innerHTML = `<div class="error-msg" style="margin-top: 8px;">請填寫工號、姓名、所屬單位後再送出。</div>`;
    return;
  }

  const answers = caseData.questions.map(q => ({
    no: q.no,
    question: q.text,
    answer: document.getElementById(`ans-${q.no}`).value.trim()
  }));

  const unanswered = answers.some(a => a.answer === '');
  if (unanswered) {
    document.getElementById('submit-error').innerHTML = `<div class="error-msg" style="margin-top: 8px;">請完成所有題目的回答後再送出。</div>`;
    return;
  }

  submitting = true;
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'AI 分析中，請稍候……';
  document.getElementById('submit-error').innerHTML = '';

  try {
    // 每次「按下送出」產生一組一次性識別碼；就算後面自動重試，這組id跟著同一個URL重送，
    // 後端會認出「這是同一次送出」，不會重複跑AI、重複寫紀錄
    const submissionId = `${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
    const params = new URLSearchParams({
      action: 'submit',
      caseId: caseData.caseId,
      empId, empName, empUnit,
      answers: JSON.stringify(answers),
      submissionId
    });
    const res = await fetchWithRetry(`${API_URL}?${params.toString()}`);
    const data = await res.json();

    if (data.error || !data.success) {
      throw new Error(data.error || '未知錯誤');
    }

    resultData = data;
    view = 'result';
    renderResult();

    // PDF存雲端硬碟這件事很慢，故意放在畫面顯示完AI回饋「之後」才呼叫，
    // 不 await、不管成敗都不影響學員畫面（失敗了也不會讓學員看到任何錯誤，避免不必要的困惑）。
    // 這裡只帶 caseId+empId 兩個小參數用 GET（後端會自己回頭去讀交卷紀錄裡的完整內容），
    // 刻意不用 POST，因為 Apps Script 對 POST 的轉址機制比較容易不穩定，這個之前已經在「送出答案」那步踩過一次坑了。
    const pdfParams = new URLSearchParams({ action: 'generatePdf', caseId: caseData.caseId, empId, _t: Date.now() });
    fetchWithRetry(`${API_URL}?${pdfParams.toString()}`, { cache: 'no-store' }).catch(() => {
      // 背景任務，重試過還是失敗就算了，承辦人可以之後自行去雲端硬碟資料夾抽查有沒有缺漏
    });
  } catch (err) {
    submitting = false;
    btn.disabled = false;
    btn.textContent = '送出回答，查看 AI 回饋';
    document.getElementById('submit-error').innerHTML = `<div class="error-msg" style="margin-top: 8px;">送出失敗，請再試一次。（${escapeHtml(err.message)}）</div>`;
  }
}

// ===== 畫面：AI 整體回饋結果 =====
function renderResult() {
  const recapHtml = resultData.items.map(it => `
    <div class="recap-row">
      <div class="recap-q">Q${it.no}．${escapeHtml(it.question)}</div>
      <div class="recap-a">${escapeHtml(it.answer)}</div>
    </div>
  `).join('');

  const fb = resultData.feedback;

  const hasNext = caseQueue.length > 0 && caseQueueIndex < caseQueue.length - 1;
  const isLastOfQueue = caseQueue.length > 0 && caseQueueIndex === caseQueue.length - 1;

  const completionBanner = isLastOfQueue
    ? `<div style="font-size: 13px; color: var(--accent); background: #EFF5F3; border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 16px;">🎉 這堂課的 ${caseQueue.length} 個個案都已完成！</div>`
    : '';

  const bottomButtons = hasNext
    ? `<div class="bottom-row">
        <span></span>
        <div style="display: flex; gap: 12px;">
          <button type="button" class="btn" id="print-btn" style="background: var(--card-bg); color: var(--accent); border: 1.5px solid var(--accent);">下載 PDF（含回答與 AI 回饋）</button>
          <button type="button" class="btn" id="next-case-btn">繼續下一個個案 →</button>
        </div>
      </div>`
    : `<div class="bottom-row">
        <button type="button" class="btn-secondary" id="back-btn">← 返回修改回答</button>
        <button type="button" class="btn" id="print-btn">下載 PDF（含回答與 AI 回饋）</button>
      </div>`;

  app.innerHTML = `
    <div class="eyebrow">AI 回饋結果</div>
    <h1>${escapeHtml(resultData.caseTitle)}</h1>
    <div style="font-size: 13px; color: var(--muted);">${escapeHtml(resultData.studentLine)}</div>
    ${completionBanner}

    <div class="card">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600;">你的回答回顧</h2>
      ${recapHtml}
    </div>

    <div class="card gold" style="gap: 18px;">
      <div class="card-heading"><div class="bar gold"></div><span style="font-size: 14px; font-weight: 700; color: var(--gold-text); letter-spacing: 1px;">給你的回饋</span></div>

      <div class="fb-row">
        <div class="fb-label">綜合各題的回答，觀察到</div>
        <p>${escapeHtml(fb.observation)}</p>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 12px; color: var(--label);">整體傾向較接近</span>
        <span class="type-badge">${escapeHtml(fb.typeLabel)}</span>
      </div>

      ${(fb.strength || fb.blindspot) ? `
      <div class="fb-two-col">
        ${fb.strength ? `<div class="fb-row fb-strength"><div class="fb-label">優點</div><p style="font-size:13px;">${escapeHtml(fb.strength)}</p></div>` : ''}
        ${fb.blindspot ? `<div class="fb-row fb-blindspot"><div class="fb-label">可能的盲點</div><p style="font-size:13px;">${escapeHtml(fb.blindspot)}</p></div>` : ''}
      </div>
      ` : ''}

      <div class="fb-row fb-divider">
        <div class="fb-label">建議方向</div>
        <p style="font-size:13px;">${escapeHtml(fb.suggestion)}</p>
      </div>
    </div>

    ${bottomButtons}
  `;

  document.getElementById('print-btn').onclick = () => window.print();

  if (hasNext) {
    document.getElementById('next-case-btn').onclick = () => {
      caseQueueIndex += 1;
      loadCase();
    };
  } else {
    document.getElementById('back-btn').onclick = () => {
      view = 'form';
      activeTab = 'answer';
      submitting = false;
      renderForm();
    };
  }
}

loadCase();
</script>

</body>
</html>
